[package]
name = "cleaner-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows platform integration for win-cleaner: Recycle Bin, known folders, and root resolution"

[lints]
workspace = true

[dependencies]
app-folders.workspace = true
cleaner-core = { version = "=1.3.1", path = "../cleaner-core" }
tracing.workspace = true

[target."cfg(windows)".dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[workspace]
members = [
    "crates/cleaner-core",
    "crates/cleaner-catalog",
    "crates/cleaner-platform",
    "crates/cleaner-app",
    "crates/app-update",
]
resolver = "3"

[workspace.package]
version = "1.1.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/handsomefox/win-cleaner"
description = "A Windows desktop app that safely cleans application and system caches"

[workspace.dependencies]
crossbeam-channel = "=0.5.17"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "links", "persistence", "x11"] }
egui_extras = { version = "=0.36.2", features = ["image"] }
flate2 = { version = "=1.1.9", default-features = false, features = ["zlib-rs"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
jiff = { version = "=0.2.38", features = ["serde"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.0"
tar = { version = "=0.4.46", default-features = false }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
walkdir = "=2.5.0"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
multiple_unsafe_ops_per_block = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"

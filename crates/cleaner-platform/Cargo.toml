[package]
name = "cleaner-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows platform integration for win-cleaner: Recycle Bin, known folders, and root resolution"

[lints]
workspace = true

[dependencies]
app-folders.workspace = true
cleaner-core = { version = "=1.2.6", path = "../cleaner-core" }

[target."cfg(windows)".dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Com",
] }

[dev-dependencies]
tempfile.workspace = true

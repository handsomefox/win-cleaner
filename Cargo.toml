[workspace]
members = [
    "crates/cleaner-core",
    "crates/cleaner-catalog",
    "crates/cleaner-platform",
    "crates/cleaner-app",
]
resolver = "3"

[workspace.package]
version = "1.2.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/handsomefox/win-cleaner"
description = "A Windows desktop app that safely cleans application and system caches"

[workspace.dependencies]
app-diagnostics = { git = "https://github.com/handsomefox/app-internals", tag = "v0.2.0", version = "=0.2.0" }
app-folders = { git = "https://github.com/handsomefox/app-internals", tag = "v0.2.0", version = "=0.2.0" }
app-update = { git = "https://github.com/handsomefox/app-internals", tag = "v0.2.0", version = "=0.2.0" }
app-update-ui = { git = "https://github.com/handsomefox/app-internals", tag = "v0.2.0", version = "=0.2.0" }
crossbeam-channel = "=0.5.17"
eframe = { version = "=0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "persistence", "x11"] }
egui_extras = { version = "=0.37.0", features = ["image"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
jiff = { version = "=0.2.38", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tracing = "=0.1.44"
walkdir = "=2.5.0"

[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
multiple_unsafe_ops_per_block = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
